services:
  - type: web
    name: fortnite-discord-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: FORTNITE_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 10000
